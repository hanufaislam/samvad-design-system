<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samvad internal viewport review</title><style>body{margin:12px;font:13px system-ui;background:#eee;color:#222}button,select{padding:8px;margin:4px 0}#stage{position:relative;width:100%;overflow:hidden;background:white}iframe{border:0;transform-origin:top left;display:block}pre{white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere}</style><h1 style="font-size:16px">Internal responsive review</h1><label>Viewport <select id="width"><option>320</option><option>599</option><option>600</option><option>1023</option><option>768</option><option>1024</option><option selected>1440</option></select></label> <label>Page <select id="route"><option value="/">Overview</option><option value="/get-started/principles/">Principles</option><option value="/foundations/colour/">Colour</option><option value="/foundations/typography/">Typography</option><option value="/design-tokens/">Planned</option><option value="/components/actions/button/">Button</option><option value="/components/actions/icon-button/">Icon button</option><option value="/components/actions/button-group/">Button group</option><option value="/components/actions/text-link/">Text link</option><option value="/components/inputs/text-input/">Text input</option><option value="/components/inputs/textarea/">Textarea</option><option value="/components/inputs/search-input/">Search input</option><option value="/components/inputs/password-input/">Password input</option><option value="/components/inputs/number-input/">Number input</option><option value="/components/inputs/otp-input/">OTP input</option><option value="/components/inputs/select/">Select / dropdown</option><option value="/components/inputs/multi-select/">Multi-select</option><option value="/components/inputs/date-picker/">Date picker</option><option value="/components/inputs/file-upload/">File upload</option><option value="/components/inputs/form-field/">Form field</option><option value="/components/selection/checkbox/">Checkbox</option><option value="/components/selection/radio-group/">Radio group</option><option value="/components/selection/switch/">Switch / toggle</option><option value="/components/selection/chips/">Chips</option><option value="/components/selection/segmented-control/">Segmented control</option></select></label><button id="theme">Toggle theme</button><button id="check">Check geometry</button><button id="batch-matrix">Run token migration responsive QA</button><div id="stage"><iframe id="site" title="Samvad responsive viewport" src="/"></iframe></div><pre id="report" aria-live="polite"></pre><script>
const frame=document.querySelector('#site'),stage=document.querySelector('#stage'),width=document.querySelector('#width'),route=document.querySelector('#route');
function size(){const w=Number(width.value);frame.width=w;frame.height=1200;const scale=Math.min(1,(document.documentElement.clientWidth-24)/w);frame.style.transform=`scale(${scale})`;stage.style.height=`${1200*scale}px`;}
function check(){const d=frame.contentDocument,w=frame.contentWindow;const header=d.querySelector('.site-header'),side=d.querySelector('.desktop-sidebar'),main=d.querySelector('main');const mainBounds=main.getBoundingClientRect();const overflow=[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>d.documentElement.clientWidth+1&&!e.closest('.table-wrap, .component-code');}).map(e=>e.tagName+'.'+e.className);document.querySelector('#report').textContent=JSON.stringify({viewport:w.innerWidth,route:route.value,theme:d.documentElement.dataset.theme,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,sidebarVisible:w.getComputedStyle(side).display!=='none',mainWidth:Math.round(mainBounds.width),headerHeight:Math.round(header.getBoundingClientRect().height),overflow},null,2);}
width.onchange=()=>{size();setTimeout(check,100)};route.onchange=()=>frame.src=route.value;frame.onload=()=>{size();frame.contentDocument.fonts.ready.then(check)};document.querySelector('#theme').onclick=()=>{frame.contentDocument.querySelector('#theme-toggle').click();check()};document.querySelector('#check').onclick=check;window.onresize=size;size();
document.querySelector('#batch-matrix').onclick=async()=>{
 const results=[];document.querySelector('#report').textContent='Running token migration responsive QA…';
 for(const path of ["/components/actions/button/", "/components/actions/icon-button/", "/components/actions/button-group/", "/components/actions/text-link/", "/components/inputs/text-input/", "/components/inputs/textarea/", "/components/inputs/search-input/", "/components/inputs/password-input/", "/components/inputs/number-input/", "/components/inputs/otp-input/", "/components/inputs/select/", "/components/inputs/multi-select/", "/components/inputs/date-picker/", "/components/inputs/file-upload/", "/components/inputs/form-field/", "/components/selection/checkbox/", "/components/selection/radio-group/", "/components/selection/switch/", "/components/selection/chips/", "/components/selection/segmented-control/", "/components/data-display/badge/", "/components/data-display/status-indicator/", "/components/data-display/avatar/", "/components/data-display/card/", "/components/data-display/list/", "/components/data-display/table/", "/components/data-display/tooltip/", "/components/data-display/progress-indicator/", "/components/data-display/skeleton-loader/", "/components/feedback/alert/", "/components/feedback/toast-notification/", "/components/feedback/feedback-states/", "/components/feedback/empty-state/", "/components/feedback/loading-state/", "/components/navigation/tabs/", "/components/navigation/breadcrumbs/", "/components/navigation/pagination/", "/components/navigation/stepper/", "/components/navigation/sidebar-navigation/", "/components/navigation/top-navigation/", "/components/overlays/dialog/", "/components/overlays/drawer/", "/components/overlays/popover/", "/components/overlays/dropdown-menu/", "/components/overlays/confirmation-dialog/", "/components/layout/container/", "/components/layout/divider/", "/components/layout/stack/", "/components/layout/grid/", "/design-tokens/", "/design-tokens/primitives/", "/design-tokens/semantic/", "/design-tokens/colour/", "/design-tokens/typography/", "/design-tokens/spacing/", "/design-tokens/radius/", "/design-tokens/elevation/", "/design-tokens/responsive/", "/design-tokens/css-variables/"]){await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=path+'#preview';});await frame.contentDocument.fonts.ready;
 for(const viewport of [320,768,1024,1440]){width.value=String(viewport);size();for(const theme of ['light','dark']){const d=frame.contentDocument;d.documentElement.dataset.theme=theme;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const bad=[...d.querySelectorAll('main *')].filter(e=>{const b=e.getBoundingClientRect();return b.width&&b.right>viewport+1&&!e.closest('.table-wrap,.component-code,.sv-table-scroll');}).map(e=>e.tagName+'.'+e.className);const grid=d.querySelector('.sv-grid');const container=d.querySelector('.sv-container');const geometry={};
 if(grid){const n=frame.contentWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length;geometry.columns=n;geometry.expectedColumns=viewport<600?1:viewport<1024?2:3;}
 if(container){geometry.padding=parseFloat(frame.contentWindow.getComputedStyle(container).paddingInlineStart);geometry.expectedPadding=viewport<600?16:viewport<1024?24:32;}
 results.push({path,viewport,theme,geometry,overflow:d.documentElement.scrollWidth>viewport,escaping:bad});
 const collapse=d.querySelector('[data-layout-control="collapse"]');
 if(collapse){collapse.value='true';collapse.dispatchEvent(new Event('change',{bubbles:true}));await new Promise(r=>requestAnimationFrame(r));const direction=frame.contentWindow.getComputedStyle(d.querySelector('.sv-stack')).flexDirection;results.push({path,viewport,theme,collapseTest:true,overflow:direction!==(viewport<600?'column':'row'),escaping:[]});collapse.value='false';collapse.dispatchEvent(new Event('change',{bubbles:true}));}
 const trigger=d.querySelector('[data-modal-open],[data-popup-trigger],[data-toast-open]');
 if(trigger){trigger.click();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const overlay=d.querySelector('dialog.sv-modal[open],.sv-popup:popover-open,.sv-toast:not([hidden])');if(overlay){const b=overlay.getBoundingClientRect();results.push({path,viewport,theme,openOverlay:true,overflow:b.left < -1||b.right>viewport+1||b.top< -1||b.bottom>frame.contentWindow.innerHeight+1,escaping:[]});}else results.push({path,viewport,theme,openOverlay:true,overflow:true,escaping:['Overlay failed to open']});d.querySelector('dialog.sv-modal[open]')?.close();const popup=d.querySelector('.sv-popup:popover-open');if(popup)popup.hidePopover();d.querySelector('[data-toast-close]')?.click();}
 }}
 }
 document.querySelector('#report').textContent=JSON.stringify({checks:results.length,failed:results.filter(r=>r.overflow||r.escaping.length||(r.geometry?.columns!==r.geometry?.expectedColumns)||(r.geometry?.padding!==r.geometry?.expectedPadding)),results});
};
</script></html>
