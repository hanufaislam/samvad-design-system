<!doctype html><meta charset="utf-8"><title>Approved token decision regression QA</title><button id="run">Run approved decision checks</button><iframe id="site" title="Actual production documentation" style="width:1100px;height:800px"></iframe><pre id="report">Ready</pre><script>
const frame=document.querySelector('#site'),results=[];const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function test(name,pass,actual){results.push({name,pass:!!pass,actual});}
async function load(path){await new Promise(resolve=>{frame.onload=resolve;frame.src=path;});await frame.contentDocument.fonts.ready;return frame.contentDocument;}
function reduceRules(d){let found=[];function visit(rules){for(const r of rules){if(r.conditionText?.includes('prefers-reduced-motion: reduce')||r.conditionText?.includes('prefers-reduced-motion:reduce'))found.push(...[...r.cssRules].map(v=>v.cssText));else if(r.cssRules)visit(r.cssRules);}}for(const sheet of d.styleSheets)visit(sheet.cssRules);return found;}
document.querySelector('#run').onclick=async()=>{results.length=0;document.querySelector('#report').textContent='Running';try{
for(const theme of ['light','dark']){
 for(const path of ['inputs/text-input','inputs/form-field','inputs/otp-input','selection/checkbox','selection/switch','actions/button','actions/icon-button','data-display/card','data-display/skeleton-loader','feedback/loading-state','feedback/toast-notification','overlays/popover']){
  const d=await load('/components/'+path+'/');const w=frame.contentWindow;d.documentElement.dataset.theme=theme;await new Promise(r=>setTimeout(r,160));const cs=e=>w.getComputedStyle(e);const q=s=>d.querySelector(s);
  if(q('.sv-field input')){const input=q('.sv-field input');test(theme+' '+path+' field shadow',cs(input).boxShadow.includes(theme==='dark'?'rgba(0, 0, 0, 0.24)':'rgba(41, 27, 37, 0.12)'),cs(input).boxShadow);test(theme+' '+path+' control boundary',cs(input).borderColor==='rgb(153, 127, 128)',cs(input).borderColor);test(theme+' '+path+' focus mapping',cs(input).getPropertyValue('--samvad-component-shared-focus-offset').trim()==='2px');}
  const label=q('.sv-field>label,.sv-choices legend');if(label)test(theme+' '+path+' label',cs(label).fontSize==='14px'&&cs(label).lineHeight==='20px'&&cs(label).fontWeight==='600',{size:cs(label).fontSize,line:cs(label).lineHeight,weight:cs(label).fontWeight});
  const helper=q('.sv-field__help');if(helper)test(theme+' '+path+' helper',cs(helper).fontSize==='14px'&&cs(helper).lineHeight==='22px'&&cs(helper).fontWeight==='400',{size:cs(helper).fontSize,line:cs(helper).lineHeight,weight:cs(helper).fontWeight});
  const error=q('.sv-field__error');if(error)test(theme+' '+path+' error',cs(error).fontSize==='14px'&&cs(error).lineHeight==='22px');
  if(path==='inputs/otp-input')test(theme+' OTP retained',cs(q('[data-otp-length]')).letterSpacing==='1.75px',cs(q('[data-otp-length]')).letterSpacing);
  const button=q('.sv-action');if(button){test(theme+' button standard easing',cs(button).transitionTimingFunction==='cubic-bezier(0.2, 0, 0, 1), cubic-bezier(0.2, 0, 0, 1)',cs(button).transitionTimingFunction);const size=q('[data-preview-control="size"]');if(size){size.value='large';size.dispatchEvent(new Event('change',{bubbles:true}));await tick();test(theme+' '+path+' large retained',cs(q('.sv-action')).minBlockSize==='56px',cs(q('.sv-action')).minBlockSize);}}
  if(path==='data-display/card')test(theme+' quiet border',cs(q('.sv-card')).borderColor===(theme==='dark'?'rgb(77, 59, 70)':'rgb(233, 221, 216)'),cs(q('.sv-card')).borderColor);
  if(path==='selection/switch'){test(theme+' full capsule radius',cs(q('.sv-switch__track')).borderRadius==='9999px');}
  if(path==='overlays/popover'||path==='feedback/toast-notification'){
   q('[data-popup-trigger],[data-toast-open]').click();await tick();const el=q('.sv-popup:popover-open,.sv-toast:not([hidden])');test(theme+' '+path+' opens',!!el);if(el){const shadow=cs(el).boxShadow;test(theme+' '+path+' shadow',shadow.includes(path.includes('popover')?(theme==='dark'?'rgba(41, 27, 37, 0.2)':'rgba(41, 27, 37, 0.08)'):(theme==='dark'?'rgba(41, 27, 37, 0.24)':'rgba(41, 27, 37, 0.12)'))&&shadow.includes(path.includes('popover')?'0px 4px 12px -2px':'0px 16px 40px -8px'),shadow);}}
  const animated=q('.sv-loading__spinner,.sv-skeleton__line');if(animated){test(theme+' '+path+' loading cadence',cs(animated).animationDuration==='0.96s',cs(animated).animationDuration);test(theme+' '+path+' loading easing',cs(animated).animationTimingFunction===(path.includes('skeleton')?'ease-in-out':'linear'),cs(animated).animationTimingFunction);}
  if(['actions/button','selection/switch','data-display/skeleton-loader','feedback/loading-state'].includes(path)){
   const rules=reduceRules(d);test(theme+' '+path+' reduced-motion media rule exists',rules.length>0);const style=d.createElement('style');style.textContent=rules.join('\n');d.head.append(style);await tick();
   const el=q('.sv-loading__spinner,.sv-skeleton__line');if(el)test(theme+' '+path+' reduced-motion rule activation',cs(el).animationName==='none',cs(el).animationName);
   if(path==='actions/button')test(theme+' button reduced-motion rule activation',cs(q('.sv-action')).transitionDuration==='0s',cs(q('.sv-action')).transitionDuration);
   if(path==='selection/switch')test(theme+' switch reduced-motion rule activation',w.getComputedStyle(q('.sv-switch__track'),'::after').transitionDuration==='0s');style.remove();
  }
 }
}
}catch(e){test('Unexpected harness error',false,String(e));}document.querySelector('#report').textContent=JSON.stringify({checks:results.length,failed:results.filter(r=>!r.pass),results,limitations:'Reduced-motion declarations extracted from actual CSS media rules and activated in isolated document; this is not OS preference emulation.'});};
</script>
<button id="shell">Run mobile shell checks</button><script>
document.querySelector('#shell').onclick=async()=>{const output=[];frame.style.width='320px';const d=await load('/components/inputs/text-input/');await tick();const menu=d.querySelector('#open-navigation');output.push({name:'Mobile nav trigger visible at320',pass:frame.contentWindow.getComputedStyle(menu).display!=='none'});menu.click();await tick();output.push({name:'Mobile nav opens',pass:!!d.querySelector('#mobile-navigation[open]')});const links=d.querySelectorAll('#mobile-navigation a[href^="/components/"]');output.push({name:'Mobile nav contains49 component links',pass:links.length===49,actual:links.length});d.querySelector('[data-close-navigation]').click();output.push({name:'Mobile nav closes',pass:!d.querySelector('#mobile-navigation[open]')});const before=d.documentElement.dataset.theme;d.querySelector('#theme-toggle').click();output.push({name:'Shell theme control toggles',pass:d.documentElement.dataset.theme!==before});document.querySelector('#report').textContent=JSON.stringify({checks:output.length,failed:output.filter(x=>!x.pass),results:output});};
</script>
