<!doctype html><meta charset="utf-8"><title>Get Started and Foundations QA</title><button id="run">Run foundation documentation QA</button><iframe id="site" title="Actual documentation" style="width:1440px;height:900px"></iframe><pre id="report">Ready</pre><script>
const routes=['/','/get-started/principles/','/get-started/for-designers/','/get-started/for-developers/','/foundations/colour/','/foundations/typography/','/foundations/spacing-and-layout/','/foundations/grid/','/foundations/shape-and-radius/','/foundations/borders-and-focus/','/foundations/elevation-and-shadows/','/foundations/iconography/','/foundations/illustration/','/foundations/accessibility/','/foundations/interaction-principles/','/foundations/motion/'];
const f=document.querySelector('#site'),results=[];const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const settle=()=>new Promise(r=>setTimeout(r,160));function test(name,pass,detail){results.push({name,pass:!!pass,detail});}async function load(path){await new Promise(r=>{f.onload=r;f.src=path;});await f.contentDocument.fonts.ready;return f.contentDocument;}
document.querySelector('#run').onclick=async()=>{document.querySelector('#report').textContent='Running';try{
for(const path of routes){const d=await load(path);for(const width of [320,768,1024,1440]){f.style.width=width+'px';for(const theme of ['light','dark']){d.documentElement.dataset.theme=theme;await raf();const escapes=[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>width+1&&!e.closest('.component-code,.table-wrap');}).map(e=>e.tagName+'.'+e.className);test(path+' '+width+' '+theme+' layout',d.documentElement.scrollWidth<=width&&escapes.length===0,escapes);const current=[...d.querySelectorAll('nav[aria-label=Documentation] a[aria-current=page]')];test(path+' '+width+' '+theme+' active route',current.length===2&&current.every(a=>new URL(a.href).pathname===path));
 if(path==='/foundations/grid/'){const grid=d.querySelector('.foundation-column-grid'),cs=f.contentWindow.getComputedStyle(grid);const expected=width<600?4:width<1024?8:12;test('page grid '+width+' '+theme,cs.gridTemplateColumns.split(' ').length===expected&&[...grid.children].filter(e=>f.contentWindow.getComputedStyle(e).display!=='none').length===expected,cs.gridTemplateColumns);}
}}}
for(const theme of ['light','dark']){
 let d=await load('/foundations/spacing-and-layout/');d.documentElement.dataset.theme=theme;const select=d.querySelector('#foundation-gap');select.value='24';select.dispatchEvent(new Event('change',{bubbles:true}));test(theme+' Stack gap updates',f.contentWindow.getComputedStyle(d.querySelector('[data-guide-stack]')).gap==='24px');test(theme+' zero spacing is zero',d.querySelector('.scale-bar').getBoundingClientRect().width===0);
 d=await load('/foundations/typography/');d.documentElement.dataset.theme=theme;const cs=e=>f.contentWindow.getComputedStyle(e);test(theme+' mono matches14/20',cs(d.querySelector('.mono-specimen')).fontSize==='14px'&&cs(d.querySelector('.mono-specimen')).lineHeight==='20px');test(theme+' final label and helper roles',cs(d.querySelector('.sv-field>label')).fontWeight==='600'&&cs(d.querySelector('.sv-field__help')).fontSize==='14px'&&cs(d.querySelector('.sv-field__help')).lineHeight==='22px');const input=d.querySelector('#type-input');input.value='Readable reference';input.dispatchEvent(new Event('input',{bubbles:true}));test(theme+' live type specimen updates',[...d.querySelectorAll('[data-type-example]')].every(e=>e.textContent==='Readable reference'));
 d=await load('/foundations/elevation-and-shadows/');d.documentElement.dataset.theme=theme;await settle();test(theme+' field exception',cs(d.querySelector('.sv-field input')).boxShadow.includes(theme==='dark'?'rgba(0, 0, 0, 0.24)':'rgba(41, 27, 37, 0.12)'));d.querySelector('[data-popup-trigger]').click();await raf();test(theme+' actual popover elevation2',cs(d.querySelector('.sv-popup')).boxShadow.includes('0px 4px 12px -2px'));d.querySelector('.sv-popup').hidePopover();d.querySelector('[data-toast-open]').click();await raf();test(theme+' toast approved pigment',cs(d.querySelector('.sv-toast')).boxShadow.includes(theme==='dark'?'rgba(41, 27, 37, 0.24)':'rgba(41, 27, 37, 0.12)'));
 d=await load('/foundations/borders-and-focus/');d.documentElement.dataset.theme=theme;await settle();test(theme+' quiet boundary',cs(d.querySelector('.sv-card')).borderColor===(theme==='dark'?'rgb(77, 59, 70)':'rgb(233, 221, 216)'));test(theme+' required boundary',cs(d.querySelector('.sv-field input')).borderColor==='rgb(153, 127, 128)');
 d=await load('/foundations/motion/');d.documentElement.dataset.theme=theme;d.querySelector('[data-guide-motion-toggle]').click();await settle();test(theme+' explicit motion toggles',d.querySelector('[data-guide-motion]').dataset.playing==='true'&&cs(d.querySelector('.motion-mark')).transform==='matrix(1, 0, 0, 1, 48, 0)');let reduced=[];for(const sheet of d.styleSheets)for(const rule of sheet.cssRules)if(rule.conditionText?.includes('prefers-reduced-motion: reduce')||rule.conditionText?.includes('prefers-reduced-motion:reduce'))reduced.push(...[...rule.cssRules].map(r=>r.cssText));test(theme+' reduced-motion media exists',reduced.length>0);const style=d.createElement('style');style.textContent=reduced.join('\n');d.head.append(style);test(theme+' reduced-motion rules disable movement transition',cs(d.querySelector('.motion-mark')).transitionDuration==='0s');style.remove();
}
}catch(e){test('Unexpected harness error',false,String(e));}document.querySelector('#report').textContent=JSON.stringify({checks:results.length,failed:results.filter(r=>!r.pass),results,limits:'Reduced-motion declarations activated in isolated fixture, not OS preference emulation.'});};
</script>
<button id="mobile">Run complete sidebar mobile checks</button><script>
document.querySelector('#mobile').onclick=async()=>{const output=[];f.style.width='320px';const d=await load('/get-started/for-designers/');const menu=d.querySelector('#open-navigation');output.push({name:'Mobile trigger visible',pass:f.contentWindow.getComputedStyle(menu).display!=='none'});menu.click();await raf();output.push({name:'Mobile drawer opens',pass:d.querySelector('#mobile-navigation').open});output.push({name:'All84 routes available in mobile sidebar',pass:d.querySelectorAll('#mobile-navigation a.nav-link').length===84,actual:d.querySelectorAll('#mobile-navigation a.nav-link').length});output.push({name:'New designer route current in mobile drawer',pass:!!d.querySelector('#mobile-navigation a[aria-current=page][href="/get-started/for-designers/"]')});d.querySelector('[data-close-navigation]').click();await raf();output.push({name:'Mobile drawer closes',pass:!d.querySelector('#mobile-navigation').open});document.querySelector('#report').textContent=JSON.stringify({checks:output.length,failed:output.filter(r=>!r.pass),results:output});};
</script>
