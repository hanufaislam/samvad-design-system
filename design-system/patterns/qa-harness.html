<!doctype html><meta charset="utf-8"><title>Patterns and Resources QA</title><button id="run">Run Patterns and Resources QA</button><iframe id="site" style="width:1440px;height:900px" title="Actual documentation"></iframe><pre id="report">Ready</pre><script>
const routes=['/patterns/','/patterns/forms/','/patterns/navigation/','/patterns/loading/','/patterns/empty-states/','/patterns/error-and-success-states/','/resources/usage-guidelines/','/resources/developer-handoff/','/resources/changelog/'];const f=document.querySelector('#site');const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const results=[];function test(name,pass,detail){results.push({name,pass:!!pass,detail});}
async function load(path){await new Promise(r=>{f.onload=r;f.src=path;});await f.contentDocument.fonts.ready;return f.contentDocument;}
document.querySelector('#run').onclick=async()=>{document.querySelector('#report').textContent='Running';try{
for(const path of routes){const d=await load(path);for(const width of [320,768,1024,1440]){f.style.width=width+'px';for(const theme of ['light','dark']){d.documentElement.dataset.theme=theme;await raf();const escape=[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>width+1&&!e.closest('.component-code,.table-wrap');}).map(e=>e.tagName+'.'+e.className);test(path+' '+width+' '+theme+' layout',d.documentElement.scrollWidth<=width&&escape.length===0,escape);const active=[...d.querySelectorAll('nav[aria-label=Documentation] a[aria-current=page]')];test(path+' '+width+' '+theme+' active links',active.length===2&&active.every(a=>new URL(a.href).pathname===path));}}
}
for(const theme of ['light','dark']){
 let d=await load('/patterns/forms/');d.documentElement.dataset.theme=theme;d.querySelector('[data-pattern-form] button[type=submit]').click();test(theme+' invalid form focuses summary',d.activeElement.hasAttribute('data-error-summary')&&!d.activeElement.hidden&&d.querySelector('#pattern-title').getAttribute('aria-invalid')==='true');const input=d.querySelector('#pattern-title');input.value='Accessible reference';input.dispatchEvent(new Event('input',{bubbles:true}));d.querySelector('button[type=submit]').click();test(theme+' valid form confirms without saving',d.querySelector('[data-error-summary]').hidden&&d.querySelector('[data-form-status]').textContent.includes('did not save'));d.querySelector('button[type=reset]').click();test(theme+' reset clears form',input.value===''&&d.querySelector('[data-field-error]').hidden);
 d=await load('/patterns/navigation/');d.documentElement.dataset.theme=theme;d.querySelector('[data-page-direction="1"]').click();test(theme+' pagination updates content',d.querySelector('[data-pattern-results]').textContent.includes('Link destinations')&&d.querySelector('[data-pattern-page]').textContent==='Items 4–6 of 9');
 d=await load('/patterns/loading/');d.documentElement.dataset.theme=theme;d.querySelector('[data-load-start]').click();test(theme+' loading coordinates busy region',d.querySelector('[data-load-region]').getAttribute('aria-busy')==='true'&&!d.querySelector('[data-load-pending]').hidden&&d.querySelector('[data-load-start]').getAttribute('aria-disabled')==='true');d.querySelector('[data-load-finish]').focus();d.querySelector('[data-load-finish]').click();test(theme+' loading resolves and restores focus',d.querySelector('[data-load-region]').getAttribute('aria-busy')==='false'&&!d.querySelector('[data-load-content]').hidden&&d.activeElement.hasAttribute('data-load-start'));
 d=await load('/patterns/empty-states/');d.documentElement.dataset.theme=theme;d.querySelector('[data-empty-add]').click();test(theme+' first item reveals filter and focuses it',!d.querySelector('[data-empty-collection]').hidden&&d.activeElement.id==='pattern-filter');const filter=d.querySelector('#pattern-filter');filter.value='no match';filter.dispatchEvent(new Event('input',{bubbles:true}));test(theme+' unmatched filter preserves collection',!d.querySelector('[data-empty-filtered]').hidden&&d.querySelector('[data-empty-results]').hidden);d.querySelector('[data-empty-clear]').click();test(theme+' clear filter restores item and focus',filter.value===''&&!d.querySelector('[data-empty-results]').hidden&&d.activeElement===filter);
 d=await load('/patterns/error-and-success-states/');d.documentElement.dataset.theme=theme;d.querySelector('[data-feedback-retry]').click();test(theme+' retry shows success',!d.querySelector('[data-feedback-success]').hidden&&d.querySelector('[data-feedback-error]').hidden);d.querySelector('[data-feedback-warn]').click();test(theme+' warning is distinct',!d.querySelector('[data-feedback-warning]').hidden&&d.querySelector('[data-feedback-success]').hidden);d.querySelector('[data-feedback-reset]').click();test(theme+' reset restores recoverable error',!d.querySelector('[data-feedback-error]').hidden);
}
}catch(e){test('Unexpected harness error',false,String(e));}document.querySelector('#report').textContent=JSON.stringify({checks:results.length,failed:results.filter(r=>!r.pass),results});};
</script>
